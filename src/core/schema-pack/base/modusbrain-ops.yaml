# ModusBrain operational skills schema pack extension.
# Adds the `skill` page type for compiled operational procedures.
api_version: modusbrain-schema-pack-v1
name: modusbrain-ops
version: "0.1.0"
description: "Operational skill artifacts — versioned, confidence-gated procedures for agent execution. Extends ModusBrain for Company Brain workflows."
extends: gbrain-base

page_types:
  - name: skill
    primitive: media
    path_prefixes:
      - skills/
      - ops/
    aliases: []
    extractable: true
    expert_routing: false

  - name: procedure
    primitive: media
    path_prefixes:
      - procedures/
      - wiki/procedures/
    aliases: []
    extractable: true
    expert_routing: false

phases: []
calibration_domains: []
